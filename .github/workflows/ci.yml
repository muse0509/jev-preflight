name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - run: make check
      - run: go test -race ./...
      - run: git diff --check
  platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - run: go test ./...
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Static build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "dist/$GOOS-$GOARCH"
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -trimpath -buildvcs=false -o "dist/$GOOS-$GOARCH/jev-preflight$suffix" ./cmd/jev-preflight
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify release archive and marketplace pin
        shell: bash
        run: |
          make package VERSION=v0.1.0
          (cd dist && sha256sum -c jev-preflight-plugin-v0.1.0.zip.sha256)
          plugin_root="$PWD/dist/unpacked/jev-preflight-plugin-v0.1.0"
          test "$(CLAUDE_PLUGIN_ROOT="$plugin_root" bash "$plugin_root/scripts/run" version)" = 'jev-preflight 0.1.0'
          git diff --exit-code
